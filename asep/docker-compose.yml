version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: asep-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asep_password
      POSTGRES_DB: asep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asep-backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:asep_password@postgres:5432/asep
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_OAUTH_CALLBACK_URL=http://localhost:8001/api/auth/github/callback
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=chrome-extension://*
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asep-celery-worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:asep_password@postgres:5432/asep
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_OAUTH_CALLBACK_URL=http://localhost:8001/api/auth/github/callback
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asep-celery-beat
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:asep_password@postgres:5432/asep
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker beat --loglevel=info

volumes:
  postgres_data:
  redis_data: